version: '3.8'
services:
  fe-app:
    image: crpi-0822sqe9pdavunw3.cn-hangzhou.personal.cr.aliyuncs.com/yanghao_node/yang:0.2
    ports:
      - 80:80
    depends_on:
      - nest-app
    restart: always
    networks:
      - common-network
  nest-app:
    build:
      context: ./
      dockerfile: ./Dockerfile
    depends_on:
      - mysql-container
      - redis-container
    restart: always   
    # ports:
    #   - 3005:3005
    networks:
      - common-network
  mysql-container:
    image: mysql
    volumes:
      - /Users/hao.yang/Desktop/test/mysql:/var/lib/mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci # 设置默认字符集
    environment:
      MYSQL_DATABASE: meeting_room_booking_system
      MYSQL_ROOT_PASSWORD: yang
    restart: always
    networks:
      - common-network
  redis-container:
    image: redis
    volumes:
      - /Users/hao.yang/code:/data
    restart: always
    networks:
      - common-network
  minio-container:
    image: bitnami/minio:latest
    ports:
      - 9000:9000
      - 9001:9001
    restart: always
    volumes:
      - /Users/guang/minio:/bitnami/minio/data
    environment:
      MINIO_ROOT_USER: guang
      MINIO_ROOT_PASSWORD: dongdong
    networks:
      - common-network

networks:
  common-network:
    driver: bridge

